<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Create Account | SecureText AI
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body class="auth-page">


<div class="auth-container">


    <div class="auth-brand">

        <div class="auth-logo">
            🛡️
        </div>

        <h1>
            SecureText AI
        </h1>

        <p>
            AI-Powered Content Security
        </p>

    </div>


    <div class="auth-card">

        <h2>
            Create Account
        </h2>

        <p class="auth-subtitle">
            Create your account to start analyzing content.
        </p>


        {% if error %}

        <div class="auth-error">
            ⚠️ {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('register') }}"
        >


            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Choose a username"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 6 characters"
                required
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Repeat your password"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                🚀 Create Account
            </button>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Sign In
            </a>

        </div>

    </div>


</div>


</body>

</html>
